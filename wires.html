<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goma / CABLES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <aside class="aside-menu" id="asideMenu">
        <div class="brand">
            <a class="navbar-brand" href="index.html" id="title">goma</a>
        </div>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="wires.html">CABLES</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="custom.html">CUSTOM</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="fix.html">REPAIR</a>
            </li>
        </ul>
    </aside>
    
    <div class="text-center mb-4 mt-5">
        <h2>goma audio wires</h2>
    </div>
    <div class="prod"> 
    <div class="container">
            <h2 >Selecciona la longitud del cable</h2>
            <form id="cableForm">
                <div class="options">
                    <label><input type="radio" name="length" value="0.7"> 0,7 metros</label>
                    <label><input type="radio" name="length" value="2">   2 metros</label>
                    <label><input type="radio" name="length" value="3.5"> 3,5 metros</label>
                    <label><input type="radio" name="length" value="5"> 5 metros</label>
                </div>
                
                <label for="quantity">Cantidad:</label>
                <input type="number" id="quantity" name="quantity" min="1" value="1">
                
                <button type="button" onclick="addToCart()">Agregar al carrito</button>
            </form>
            
            <p id="cartMessage"></p>
        </div>
    
        <div class="custom-measure">
            <h3>¿Querés una medida específica?</h3>
            <button type="button" onclick="window.location.href='custom.html'">Armalo</button>
        </div>
        
        <script>
            function addToCart() {
                const length = document.querySelector('input[name="length"]:checked');
                const quantity = document.getElementById("quantity").value;
                const message = document.getElementById("cartMessage");
                
                if (length) {
                    message.textContent = `${quantity}  de ${length.value} metros ha sido agregado al carrito`;
                } else {
                    message.textContent = "Selecciona una longitud del cable.";
                }
            }
        </script>
        </div>
        <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="splittersDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">SPLITTERS</a>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">XLR M - F.F</a></li>
                <li><a class="dropdown-item" href="#">XLR F - M.M</a></li>
                <li><a class="dropdown-item" href="#">TS - TS.TS</a></li>
                <li><a class="dropdown-item" href="#">TRS - TRS.TRS</a></li>
            </ul>
        </li>
    </body> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/products.json"></script>
</body>
</html>
