<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
    <title>goma / CUSTOM</title>
</head>
<body>

   

<div class="container mt-5">
        <h2>Armá tus cables</h2>
        <form>
            <div class="mb-3">
                <label for="cantidadMetros" class="form-label">metros</label>
                <input type="number" class="form-control" id="cantidadMetros" name="cantidadMetros" placeholder="" required>
            </div>
            <div class="mb-3">
                <label for="incrementador" class="form-label"></label>
                <input type="number" class="form-control" id="incrementador" name="incrementador" value="1" min="1" required>
            </div>
            
            <div class="form-section">
                <div>
                    <p>Extremo 1:</p>
                    <div class="btn-group" role="group" aria-label="Extremo 1">
                        <button type="button" class="btn btn-outline-primary btn-radio">XLR</button>
                        <button type="button" class="btn btn-outline-secondary btn-radio">TRS</button>
                        <button type="button" class="btn btn-outline-success btn-radio">TS</button>
                    </div>
                </div>
                
                <div>
                    <p>Extremo 2:</p>
                    <div class="btn-group" role="group" aria-label="Extremo 2">
                        <button type="button" class="btn btn-outline-dark btn-radio" id="btn-XLR">XLR</button>
                        <button type="button" class="btn btn-outline-light btn-radio" id="btn-TRS">TRS</button>
                        <button type="button" class="btn btn-outline-dark btn-radio" id="btn-TS">TS</button>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-success">Listo</button>
        </form>
    </div>
    

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
