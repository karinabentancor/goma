<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles/styles.css">
    <link rel="stylesheet" href="styles/fix-styles.css">
    <title>goma / REPAIR</title>
</head>
<body>
    

    <div class="container mt-5">
        <h2>Mandá tus fotos</h2>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="photo" class="form-label visually-hidden">Sleccionar</label>
                <input type="file" class="form-control" id="photo" name="photo" accept="image/*" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label"placeholder="contanos sobre el problema"> </label>
                <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-dark">Reparar</button>
        </form>
<body>
    <div id="dateTimeFormContainer" class="card">
        <h3>propuesta de fecha y hora</h3>
        <form id="dateTimeForm">
            <label for="date">seleccione una fecha:</label>
            <input type="date" id="date" name="date" class="form-control" required>
    
            <label for="time">seleccione una hora:</label>
            <input type="time" id="time" name="time" class="form-control" required>
    
            <button type="button" class="btn btn-dark" onclick="submitDateTime()">Enviar</button>
        </form>
        <div class="output" id="output"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
